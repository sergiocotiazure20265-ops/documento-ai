name: Build e Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocumentoAI.sln

      - name: Build
        run: dotnet build DocumentoAI.sln --configuration Release --no-restore

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DocumentoAI.sln

      - name: Tests
        run: dotnet test DocumentoAI.sln --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Tests do relatorio de email
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .github/scripts/tests -v
